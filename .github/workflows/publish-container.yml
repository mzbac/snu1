name: Publish CUDA container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag containing the CUDA binary asset
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-snu1-cuda-sm89
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mzbac/snu1
  TARGET: linux-x86_64-cuda12.8-sm89

jobs:
  publish:
    name: Verify release and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out the binary packaging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve and verify the release asset
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi

          version="${tag#v}"
          asset="snu1-${version}-${TARGET}.tar.gz"
          match_count="$(awk -v name="$asset" '$2 == name {count++} END {print count + 0}' release-checksums.txt)"
          if [[ "$match_count" != 1 ]]; then
            echo "::error file=release-checksums.txt::Expected exactly one checksum for $asset; found $match_count."
            exit 1
          fi
          expected_sha="$(awk -v name="$asset" '$2 == name {print $1}' release-checksums.txt)"
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error file=release-checksums.txt::Invalid SHA-256 for $asset."
            exit 1
          fi

          release_json="${RUNNER_TEMP}/snu1-release.json"
          curl --fail-with-body --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --output "$release_json"

          asset_count="$(jq --arg name "$asset" '[.assets[] | select(.name == $name)] | length' "$release_json")"
          if [[ "$asset_count" != 1 ]]; then
            echo "::error::Expected exactly one GitHub release asset named $asset; found $asset_count."
            exit 1
          fi

          asset_url="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .url' "$release_json")"
          asset_size="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .size' "$release_json")"
          api_digest="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest' "$release_json")"
          if [[ "$api_digest" != "sha256:${expected_sha}" ]]; then
            echo "::error::Release digest mismatch for $asset: manifest=sha256:${expected_sha}, GitHub=${api_digest}."
            exit 1
          fi

          archive="${RUNNER_TEMP}/${asset}"
          curl --fail-with-body --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$asset_url" --output "$archive"

          actual_size="$(stat --format='%s' "$archive")"
          if [[ "$actual_size" != "$asset_size" ]]; then
            echo "::error::Release size mismatch for $asset: API=${asset_size}, downloaded=${actual_size}."
            exit 1
          fi
          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum --check --strict

          expected_member="snu1-${version}-${TARGET}/bin/snu1"
          regular_members="$(tar -tzf "$archive" | sed '/\/$/d')"
          if [[ "$regular_members" != "$expected_member" ]]; then
            echo "::error::Release archive must contain only $expected_member."
            printf 'Archive members:\n%s\n' "$regular_members"
            exit 1
          fi
          member_type="$(tar -tvzf "$archive" "$expected_member" | cut -c1)"
          if [[ "$member_type" != "-" ]]; then
            echo "::error::Release member $expected_member is not a regular file."
            exit 1
          fi

          context="${RUNNER_TEMP}/snu1-container-context"
          mkdir -p "$context"
          tar -xzf "$archive" --strip-components=2 -C "$context" "$expected_member"
          chmod 0755 "$context/snu1"
          cp Dockerfile .dockerignore "$context/"

          version_output="$("$context/snu1" --version)"
          printf '%s\n' "$version_output"
          grep -Fq "snu1_version=${version}" <<<"$version_output"
          grep -Fq "backend=cuda" <<<"$version_output"
          grep -Fq "build_target=${TARGET}" <<<"$version_output"
          revision="$(sed -n 's/.*revision=\([0-9a-f]\{40\}\).*/\1/p' <<<"$version_output")"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the native source revision from snu1 --version."
            exit 1
          fi

          release_url="$(jq -er '.html_url' "$release_json")"
          published_at="$(jq -er '.published_at' "$release_json")"
          source_date_epoch="$(date --date="$published_at" +%s)"
          prerelease="$(jq -r '.prerelease' "$release_json")"
          if [[ "$prerelease" != true && "$prerelease" != false ]]; then
            echo "::error::GitHub returned an invalid prerelease value: $prerelease"
            exit 1
          fi

          latest_json="${RUNNER_TEMP}/snu1-latest-release.json"
          curl --fail-with-body --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest" \
            --output "$latest_json"
          latest_tag="$(jq -er '.tag_name' "$latest_json")"
          is_latest=false
          if [[ "$prerelease" == false && "$tag" == "$latest_tag" ]]; then
            is_latest=true
          fi

          {
            echo "version=$version"
            echo "revision=$revision"
            echo "release_url=$release_url"
            echo "published_at=$published_at"
            echo "source_date_epoch=$source_date_epoch"
            echo "is_latest=$is_latest"
            echo "context=$context"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Verified SNU1 release"
            echo
            echo "- Release: [${tag}](${release_url})"
            echo "- Asset: \`${asset}\`"
            echo "- SHA-256: \`${expected_sha}\`"
            echo "- Native revision: \`${revision}\`"
            echo "- Updates moving tags: \`${is_latest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.version }}-cuda12.8-sm89
            type=raw,value=cuda12.8-sm89,enable=${{ steps.release.outputs.is_latest }}
            type=raw,value=latest,enable=${{ steps.release.outputs.is_latest }}
          labels: |
            org.opencontainers.image.title=snu1
            org.opencontainers.image.description=Native SenseNova-U1 image generation and editing server for NVIDIA Ada SM89 GPUs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=${{ steps.release.outputs.release_url }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.created=${{ steps.release.outputs.published_at }}

      - name: Build and push the source-free image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.release.outputs.context }}
          file: ${{ steps.release.outputs.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SNU1_VERSION=${{ steps.release.outputs.version }}
            SNU1_REVISION=${{ steps.release.outputs.revision }}
            SNU1_RELEASE_URL=${{ steps.release.outputs.release_url }}
            SOURCE_DATE_EPOCH=${{ steps.release.outputs.source_date_epoch }}
          provenance: mode=max
          sbom: true

      - name: Attest the published image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify the published manifest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}"
          {
            echo
            echo "### Published image"
            echo
            echo "\`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
